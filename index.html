<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ancient Bob</title>
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="css/game.css?v=13">
</head>
<body>
  <div class="stage">
    <div class="topbar">
      <h1>Ancient Bob</h1>
      <button id="music" type="button" aria-pressed="false" aria-label="Turn music on">
      <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9l5 6M21 9l-5 6"/>
      </svg>
      <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9a4 4 0 0 1 0 6"/>
        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M18.5 6.5a7.5 7.5 0 0 1 0 11"/>
      </svg>
      </button>
    </div>
    <div class="screen">
      <canvas id="game" width="320" height="320"></canvas>
      <div id="dialogue" hidden>
        <p id="dialogue-who"></p>
        <p id="dialogue-line"></p>
      </div>
      <div id="menu" hidden>
        <p id="menu-title"></p>
        <div id="menu-body"></div>
      </div>
      <p id="menu-help">Z / Space selects
X goes back</p>
      <p id="status">WASD / Arrows move
Z / Space acts
X drop item
Q toggles the grid
Enter menu</p>
    </div>
  </div>
  <script type="module" src="js/music.js"></script>
  <script type="module" src="js/main.js?v=61"></script>
</body>
</html>
