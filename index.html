<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ancient Bob</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #14110e;
      color: #e7dccb;
      font-family: "Courier New", Courier, monospace;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-align: center;
    }

    .stage {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      width: min(88vmin, 768px);
    }

    .screen {
      position: relative;
      width: 100%;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #000;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
    }

    #dialogue {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 10px;
      box-sizing: border-box;
      height: auto;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 12px 14px;
      border: 2px solid #e7dccb;
      background: rgba(20, 17, 14, 0.94);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    #dialogue[hidden] {
      display: none;
    }

    #dialogue p {
      max-width: none;
      margin: 0;
      text-align: left;
    }

    #dialogue-who {
      flex: none;
      margin-bottom: 6px;
      color: #e6c15a;
      font-size: 16px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #dialogue-line {
      flex: none;
      height: calc(1.5em * 3);
      overflow: hidden;
      font-size: 18px;
      line-height: 1.5;
    }

    #dialogue-line .dialogue-caret {
      color: #e6c15a;
    }

    #music {
      width: 44px;
      height: 44px;
      padding: 8px;
      border: 2px solid #e7dccb;
      background: rgba(20, 17, 14, 0.78);
      color: #e7dccb;
      cursor: pointer;
    }

    #music svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    #music .icon-on,
    #music.is-on .icon-off {
      display: none;
    }

    #music.is-on .icon-on {
      display: block;
    }

    p {
      margin: 0;
      max-width: min(88vmin, 768px);
      font-size: 14px;
      line-height: 1.45;
      letter-spacing: 0.02em;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Ancient Bob</h1>
  <div class="stage">
    <button id="music" type="button" aria-pressed="false" aria-label="Turn music on">
      <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9l5 6M21 9l-5 6"/>
      </svg>
      <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/>
        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9a4 4 0 0 1 0 6"/>
        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M18.5 6.5a7.5 7.5 0 0 1 0 11"/>
      </svg>
    </button>
    <div class="screen">
      <canvas id="game" width="384" height="384"></canvas>
      <div id="dialogue" hidden>
        <p id="dialogue-who"></p>
        <p id="dialogue-line"></p>
      </div>
    </div>
  </div>
  <p id="status">Grid on · Arrows or WASD move · Space talks · Q toggles the grid</p>
  <script src="music.js"></script>
  <script src="game.js"></script>
</body>
</html>
